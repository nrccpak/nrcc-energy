name: Keep Supabase awake

# The free Supabase plan pauses a project after about a week without activity.
# This pings a tiny function that only returns "ok" every 3 days.
on:
  schedule:
    - cron: '17 3 */3 * *'   # 03:17 UTC every 3rd day (08:17 Pakistan time)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST \
            'https://tlxljdgkimbcilvhoeji.supabase.co/rest/v1/rpc/keepalive' \
            -H 'apikey: sb_publishable_ZlFm2ADrcnUO0BKDq6qCiA_L0L-Wn8v' \
            -H 'Content-Type: application/json' -d '{}')
          echo "HTTP $code: $(cat /tmp/out)"
          test "$code" = "200"
