<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NRCC Energy</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--mute:#667085;--line:#e4e7ec;--brand:#0f5132;--brand2:#157347;--stop:#b42318;--stopbg:#fef3f2;--warn:#b54708;--warnbg:#fffaeb;--ok:#067647;--okbg:#ecfdf3;--info:#175cd3;--infobg:#eff8ff}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--brand);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;flex:1}
header button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:5px 10px;font-size:13px}
main{max-width:980px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 10px} h3{font-size:14px;margin:16px 0 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--mute);font-size:13px}
button.primary{background:var(--brand2);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:15px}
button.sec{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px}
button:disabled{opacity:.5}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
input.num{text-align:right;font-variant-numeric:tabular-nums}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 4px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:14px}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.row{display:grid;grid-template-columns:1.4fr 1fr 1fr .9fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row .code{font-weight:600} .row .name{font-size:12px;color:var(--mute)}
.row .k{text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.row.head{font-size:12px;color:var(--mute);border-bottom:2px solid var(--line)}
.neg{color:var(--stop);font-weight:600}
.saved{outline:2px solid #a6f4c5} .err{outline:2px solid #fda29b}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.p-draft{background:#f2f4f7;color:#344054}.p-checked{background:var(--infobg);color:var(--info)}.p-final{background:var(--okbg);color:var(--ok)}
.sev{border-radius:8px;padding:9px 11px;margin:6px 0;font-size:14px}
.STOP{background:var(--stopbg);color:var(--stop)} .WARNING{background:var(--warnbg);color:var(--warn)} .INFO{background:var(--infobg);color:var(--info)}
table.months{width:100%;border-collapse:collapse} table.months td,table.months th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
table.months th{font-size:12px;color:var(--mute)} table.months tr{cursor:pointer} table.months td.n{text-align:right;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1d2330;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:9;max-width:92vw}
.lock{background:#f2f4f7;border-radius:8px;padding:8px 10px;font-size:13px;color:#344054;margin-bottom:10px}
nav.top{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
nav.top button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:14px}
nav.top button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* report */
.rep{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px 24px;margin-bottom:12px}
.rep-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--brand);padding-bottom:10px;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.rep-head .t1{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.rep-head .t2{font-size:22px;font-weight:700;color:var(--brand)}
.rep h2.sec{font-size:15px;margin:22px 0 8px;padding:6px 10px;background:#eef4f0;border-left:4px solid var(--brand);border-radius:4px;color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:6px 0 10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .u{font-size:13px;color:var(--mute);font-weight:500}
.kpi .s{font-size:12px;margin-top:4px}
.kpi svg{display:block;margin-top:6px;width:100%;height:36px}
table.t{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 8px}
table.t th{background:#f2f4f7;color:#344054;font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:12px}
table.t td{padding:6px 8px;border-bottom:1px solid #eef0f3;vertical-align:top}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.sub td{font-weight:700;background:#fafbfc}
table.t tr.head td{font-weight:700;background:#eef4f0;color:var(--brand)}
.st{display:inline-block;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:600;white-space:nowrap}
.st-ok{background:var(--okbg);color:var(--ok)}.st-flagged{background:var(--warnbg);color:var(--warn)}.st-not_in_operation{background:#f2f4f7;color:#475467}
.st-low_utilisation{background:var(--infobg);color:var(--info)}.st-estimated{background:#f4f3ff;color:#5925dc}.st-out_of_service{background:#f2f4f7;color:#475467}
.foot{font-size:11px;color:var(--mute);margin-top:18px;border-top:1px solid var(--line);padding-top:8px}
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tbar .grow{flex:1}
/* trends */
.tr-grid{display:grid;grid-template-columns:300px 1fr;gap:12px}
.picker{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.picker h4{margin:10px 0 4px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.picker label{display:flex;gap:8px;align-items:flex-start;margin:0;padding:4px 2px;font-size:13px;color:var(--ink);cursor:pointer}
.picker input{width:auto;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border-radius:999px;padding:3px 10px;font-size:12px;color:#fff}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}
.opts label{display:flex;gap:6px;align-items:center;margin:0;color:var(--ink);font-size:13px}
.opts input[type=checkbox]{width:auto}
.chartbox{position:relative;height:420px}
details.rule{border-bottom:1px solid var(--line);padding:8px 2px}
details.rule summary{cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:10px;font-size:14px}
details.rule summary .val{font-weight:700;font-variant-numeric:tabular-nums}
@media print{
  header,nav.top,.tabs,.tbar,.lock,.actions,.toast,.noprint{display:none!important}
  body{background:#fff;font-size:11px} main{max-width:none;padding:0}
  .rep{border:0;padding:0;margin:0}
  .rep h2.sec{break-after:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.t th,.kpi,.st,table.t tr.sub td,table.t tr.head td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.t{font-size:10px} .pb{break-before:page} tr{break-inside:avoid}
  @page{size:A4;margin:14mm 12mm}
}
@media (max-width:820px){.tr-grid{grid-template-columns:1fr}.picker{max-height:260px}}
@media (max-width:640px){
  .row{grid-template-columns:1fr 1fr;row-gap:6px}
  .row .who{grid-column:1/3}
  .row.head{display:none}
  .row .lab{display:block;font-size:11px;color:var(--mute)}
  .grid2{grid-template-columns:1fr}
  table.months .hide-s{display:none}
}
@media (min-width:641px){.row .lab{display:none}}
</style>
</head>
<body>
<header><h1 id="title">NRCC Energy</h1><button id="homeBtn" hidden>Months</button><button id="outBtn" hidden>Sign out</button></header>
<main id="app"><div class="card">Loading…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPA_URL = 'https://tlxljdgkimbcilvhoeji.supabase.co';
const SUPA_KEY = 'sb_publishable_ZlFm2ADrcnUO0BKDq6qCiA_L0L-Wn8v';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY, { db: { schema: 'energy' } });
const $ = s => document.querySelector(s);
const app = $('#app');
const fmt = (v, d = 0) => v === null || v === undefined || v === '' || isNaN(v) ? '—' : Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const parseNum = s => { if (s === null || s === undefined) return null; s = String(s).replace(/,/g, '').trim(); if (s === '') return null; const n = Number(s); return isNaN(n) ? NaN : n; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const monthLabel = k => { const [y, m] = k.split('-'); return new Date(+y, +m - 1, 1).toLocaleString('en-GB', { month: 'short', year: 'numeric' }); };
function toast(msg, ms = 2600) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
async function q(p) { const { data, error } = await p; if (error) { toast(error.message, 5000); throw error; } return data; }

let state = { user: null, role: null, month: null, tab: 'pp' };

// ---------------- auth ----------------
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return loginView();
  state.user = session.user;
  const me = await sb.from('app_user').select('full_name,role').eq('user_id', session.user.id).maybeSingle();
  if (!me.data) { app.innerHTML = `<div class="card"><h2>No access</h2><p>This login (${esc(session.user.email)}) is not set up for the energy system.</p><button class="sec" onclick="signOut()">Sign out</button></div>`; return; }
  state.role = me.data.role;
  $('#outBtn').hidden = false; $('#homeBtn').hidden = false;
  route();
}
function loginView() {
  $('#outBtn').hidden = true; $('#homeBtn').hidden = true;
  app.innerHTML = `<div class="card" style="max-width:420px;margin:30px auto">
    <h2>Sign in</h2><p class="muted">NRCC Energy Management — Electrical Department</p>
    <label>Email</label><input id="em" type="email" autocomplete="username">
    <label>Password</label><input id="pw" type="password" autocomplete="current-password">
    <div class="actions"><button class="primary" id="go">Sign in</button></div></div>`;
  $('#go').onclick = async () => {
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
    if (error) return toast(error.message, 5000);
    boot();
  };
  $('#pw').onkeydown = e => { if (e.key === 'Enter') $('#go').click(); };
}
async function signOut() { await sb.auth.signOut(); location.hash = ''; loginView(); }
$('#outBtn').onclick = signOut;
$('#homeBtn').onclick = () => { location.hash = ''; };
window.onhashchange = () => state.user && route();

function route() {
  const h = location.hash.replace('#', '');
  const m = h.match(/^m\/(\d{4}-\d{2})(?:\/(\w+))?$/);
  if (m) { state.month = m[1]; state.tab = m[2] || 'pp'; return monthView(); }
  if (h.startsWith('trends')) return trendsView();
  if (h === 'rules') return rulesView();
  if (h === 'history') return historyView();
  homeView();
}

// ---------------- home ----------------
async function homeView() {
  $('#title').textContent = 'NRCC Energy';
  app.innerHTML = '<div class="card">Loading…</div>';
  const months = await q(sb.from('month').select('month_key,status,is_history').order('month_key', { ascending: false }));
  const keys = months.map(m => m.month_key);
  const res = await q(sb.from('result').select('month_key,indicator,value,status').in('indicator', ['Summary!C38', 'Summary!J37']).in('month_key', keys));
  const chk = await q(sb.from('check_result').select('month_key,severity').in('severity', ['STOP', 'WARNING']).in('month_key', keys));
  const kpi = {}; res.forEach(r => (kpi[r.month_key] ??= {})[r.indicator] = r);
  const cnt = {}; chk.forEach(c => { (cnt[c.month_key] ??= { STOP: 0, WARNING: 0 })[c.severity]++; });
  const last = keys[0];
  const next = last ? (() => { const [y, m] = last.split('-').map(Number); const d = new Date(y, m, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; })() : null;
  const canOpen = ['admin', 'entry'].includes(state.role) && months[0]?.status === 'final';
  app.innerHTML = topNav('home') + `
  <div class="card"><h2>Months</h2>
    ${canOpen ? `<div class="actions" style="margin:0 0 10px"><button class="primary" id="openNext">Start ${monthLabel(next)}</button></div>` :
      (months[0] && months[0].status !== 'final' ? `<p class="muted">Finish ${monthLabel(last)} before starting the next month.</p>` : '')}
    <table class="months"><thead><tr><th>Month</th><th>Status</th><th class="n">Gray kWh/t</th><th class="n">White kWh/t</th><th class="hide-s">Checks</th></tr></thead><tbody>
    ${months.map(m => { const g = kpi[m.month_key]?.['Summary!C38'], w = kpi[m.month_key]?.['Summary!J37'], c = cnt[m.month_key];
      return `<tr data-m="${m.month_key}"><td>${monthLabel(m.month_key)}${m.is_history ? ' <span class="muted">· history</span>' : ''}</td>
      <td><span class="pill p-${m.status}">${m.status}</span></td>
      <td class="n">${g?.value != null ? fmt(g.value, 1) + (g.status === 'estimated' ? '*' : '') : '—'}</td>
      <td class="n">${w?.value != null ? fmt(w.value, 1) + (w.status === 'estimated' ? '*' : '') : '—'}</td>
      <td class="hide-s">${c ? `${c.STOP ? `<span class="pill STOP">${c.STOP} STOP</span> ` : ''}${c.WARNING ? `<span class="pill WARNING">${c.WARNING} warn</span>` : ''}` : '<span class="muted">—</span>'}</td></tr>`; }).join('')}
    </tbody></table>
    <p class="muted">* estimated — kiln stopped, cement ground from stock clinker (decision 51).</p></div>`;
  app.querySelectorAll('tr[data-m]').forEach(tr => tr.onclick = () => location.hash = `m/${tr.dataset.m}/${months.find(x => x.month_key === tr.dataset.m).status === 'final' ? 'report' : 'pp'}`);
  const b = $('#openNext'); if (b) b.onclick = async () => { await q(sb.schema('energy').rpc('open_month', { p_month: next })); toast(`${monthLabel(next)} started — opening readings carried forward`); location.hash = `m/${next}/pp`; };
}

// ---------------- month ----------------
let cache = {};
async function loadMonth(mk) {
  const [month, meters, readings, items, prod, events, ppx, prevR] = await Promise.all([
    q(sb.from('month').select('*').eq('month_key', mk).single()),
    q(sb.from('meter').select('*').eq('active', true).order('entry_order')),
    q(sb.from('reading').select('*').eq('month_key', mk)),
    q(sb.from('production_item').select('*').eq('active', true).order('entry_order')),
    q(sb.from('production').select('*').eq('month_key', mk)),
    q(sb.from('meter_event').select('*').eq('month_key', mk).order('id')),
    q(sb.from('pp_crosscheck').select('*').eq('month_key', mk).maybeSingle()),
    q(sb.from('reading').select('meter_code,closing,kwh_doc').eq('month_key', prevMonth(mk)))
  ]);
  cache = { month, meters, items, events, ppx,
    rd: Object.fromEntries(readings.map(r => [r.meter_code, r])),
    pr: Object.fromEntries(prod.map(p => [p.item_code, p])),
    prev: Object.fromEntries(prevR.map(r => [r.meter_code, r])) };
}
function prevMonth(mk) { const [y, m] = mk.split('-').map(Number); const d = new Date(y, m - 2, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; }
const editable = () => cache.month.status !== 'final' && ['admin', 'entry'].includes(state.role);

async function monthView() {
  $('#title').textContent = monthLabel(state.month);
  app.innerHTML = '<div class="card">Loading…</div>';
  await loadMonth(state.month);
  const tabs = [['report', 'Report'], ['pp', 'Power plant'], ['meters', 'Plant meters'], ['prod', 'Production'], ['events', 'Meter changes'], ['checks', 'Checks']];
  const st = cache.month.status;
  app.innerHTML = `
    <div class="tabs">${tabs.map(([k, l]) => `<button class="${state.tab === k ? 'on' : ''}" data-t="${k}">${l}</button>`).join('')}</div>
    ${st === 'final' ? `<div class="lock">🔒 ${monthLabel(state.month)} is final — figures are locked as sent${cache.month.is_history ? ' (loaded from the old workbook)' : ''}. Changes need a logged reason.</div>` : ''}
    <div id="pane"></div>`;
  app.querySelectorAll('.tabs button').forEach(b => b.onclick = () => location.hash = `m/${state.month}/${b.dataset.t}`);
  ({ report: reportTab, pp: ppTab, meters: metersTab, prod: prodTab, events: eventsTab, checks: checksTab })[state.tab]();
}

// --- save one reading (save as you go) ---
async function saveReading(code, patch, el) {
  const row = { month_key: state.month, meter_code: code, ...patch };
  const { error } = await sb.from('reading').upsert(row, { onConflict: 'month_key,meter_code' });
  if (error) { el && el.classList.add('err'); return toast(error.message, 5000); }
  cache.rd[code] = { ...(cache.rd[code] || {}), ...row };
  if (el) { el.classList.remove('err'); el.classList.add('saved'); setTimeout(() => el.classList.remove('saved'), 900); }
}
function kwhOf(code) {
  const r = cache.rd[code] || {}; const ev = cache.events.find(e => e.meter_code === code);
  if (ev) return ev.kwh_override ?? ((ev.old_final - (r.opening ?? 0)) + ((r.closing ?? 0) - (ev.new_initial ?? 0)));
  if (r.opening != null && r.closing != null) return r.closing - r.opening;
  return r.kwh_doc ?? null;
}
function bindNum(sel, fn) {
  app.querySelectorAll(sel).forEach(inp => {
    inp.addEventListener('change', async () => {
      const v = parseNum(inp.value);
      if (Number.isNaN(v)) { inp.classList.add('err'); return toast('Numbers only'); }
      await fn(inp, v);
    });
  });
}

// ---------------- Power plant tab ----------------
function ppTab() {
  const ed = editable();
  const pm = cache.meters.filter(m => m.kind === 'dg' || m.kind === 'pp_feeder');
  const histKwhOnly = pm.every(m => cache.rd[m.code]?.opening == null && cache.rd[m.code]?.closing == null);
  const firstLive = !cache.month.is_history && pm.some(m => cache.rd[m.code]?.opening == null);
  const group = (title, list) => `<h3>${title}</h3>
    <div class="row head"><div>Meter</div><div>Initial</div><div>Final</div><div class="k">kWh</div></div>
    ${list.map(m => { const r = cache.rd[m.code] || {}; const k = kwhOf(m.code);
      return `<div class="row"><div class="who"><div class="code">${m.code}</div><div class="name">${esc(m.name)}</div></div>
      <div><span class="lab">Initial</span><input class="num" inputmode="decimal" data-c="${m.code}" data-f="opening" value="${r.opening ?? ''}" ${ed && (firstLive || r.opening == null) ? '' : 'readonly'} placeholder="${firstLive ? 'from PIC PDF' : ''}"></div>
      <div><span class="lab">Final</span><input class="num" inputmode="decimal" data-c="${m.code}" data-f="closing" value="${r.closing ?? ''}" ${ed ? '' : 'readonly'}></div>
      <div class="k ${k < 0 ? 'neg' : ''}" id="k_${m.code}">${fmt(k)}</div></div>`; }).join('')}`;
  const gen = pm.filter(m => m.kind === 'dg').reduce((s, m) => s + (kwhOf(m.code) || 0), 0);
  const out = pm.filter(m => m.kind === 'pp_feeder').reduce((s, m) => s + (kwhOf(m.code) || 0), 0);
  const x = cache.ppx || {};
  $('#pane').innerHTML = `<div class="card">
    <h2>Power plant — PIC "Power Generation & Consumption"</h2>
    ${histKwhOnly && cache.month.is_history ? '<p class="muted">History month: the old workbook holds kWh only, no meter readings.</p>' : ''}
    ${firstLive ? '<p class="muted">First live month: type each <b>initial reading</b> once from the PIC PDF. From next month they carry forward automatically.</p>' : ''}
    <div class="grid2"><div><label>PP reading date &amp; time</label><input type="datetime-local" id="ppAt" value="${cache.month.pp_read_at ? cache.month.pp_read_at.slice(0, 16) : ''}" ${ed && state.role === 'admin' ? '' : 'readonly'}></div></div>
    ${group('Line 1 generation — DG1 to DG6', pm.filter(m => m.kind === 'dg').slice(0, 6))}
    ${group('Line 2 generation — DG7 to DG9', pm.filter(m => m.kind === 'dg').slice(6))}
    ${group('Line 1 outgoing feeders', pm.filter(m => m.kind === 'pp_feeder').slice(0, 9))}
    ${group('Line 2 outgoing feeders', pm.filter(m => m.kind === 'pp_feeder').slice(9))}
    <h3>Totals</h3>
    <div class="grid2"><div>Generation (from readings): <b id="tGen">${fmt(gen)}</b> kWh</div><div>Outgoing (from readings): <b id="tOut">${fmt(out)}</b> kWh</div>
    <div>Difference: <b id="tDif">${fmt(gen - out)}</b> kWh</div></div>

      <tr><td>White kWh/t</td>${tr.map(x => `<td class="n">${x.white == null ? '—' : fmt(x.white, 1)}</td>`).join('')}</tr></tbody></table>

    <h2 class="sec">7 · Rules &amp; changes this month</h2>

    ${R.changes.length ? `<p><b>Changes after final:</b></p>${R.changes.map(c => `<div class="sev INFO">${new Date(c.at).toLocaleString('en-GB')} · ${esc(c.tbl)} · ${esc(c.reason || '')}</div>`).join('')}` : '<p class="muted">No changes after final.</p>'}
    ${R.is_history ? `<p class="muted">History month: inputs from the old workbook, recalculated with the agreed rules. Old workbook reported gray ${fmt(L['Summary!C38'], 1)} and white ${fmt(L['Summary!J37'], 1)} kWh/t; see the transition note (Trends → "Old vs new").</p>` : ''}
    <div class="foot">Every figure is calculated on the server from the recorded readings, production and the Rules table — nothing typed. Readings: plant ${R.plant_read_at ? new Date(R.plant_read_at).toLocaleString('en-GB') : '—'} · power plant ${R.pp_read_at ? new Date(R.pp_read_at).toLocaleString('en-GB') : '—'} · generated ${new Date().toLocaleString('en-GB')}.</div>
  </div>`;
  $('#btnPdf').onclick = () => window.print();
  $('#btnXls').onclick = () => exportReportExcel(R, { plant, ppAux, housing, wts, mm1, mm2, ppdiff, outgoing, l1Out, l2Out }).catch(e => toast(e.message || 'Excel export failed', 5000));

      { label: 'Gray kWh/t', data: tr.map(x => x.gray), borderColor: '#157347', backgroundColor: '#157347', tension: .25, spanGaps: false, pointStyle: tr.map(x => x.gray_est ? 'triangle' : 'circle'), pointRadius: tr.map(x => x.gray_est ? 6 : 3) },
      { label: 'White kWh/t', data: tr.map(x => x.white), borderColor: '#5925dc', backgroundColor: '#5925dc', tension: .25, yAxisID: 'y2' }] },
      options: { maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { position: 'bottom' } },
        scales: { y: { title: { display: true, text: 'Gray kWh/t' } }, y2: { position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'White kWh/t' } } } } });
  } catch (e) { /* chart is optional */ }
}

// ---------- Excel export of the report (formatted) ----------
async function exportReportExcel(R, X) {
  await loadScript(EXCEL_JS);
  const S = R.S, g = k => S[k] ?? null, ml = monthLabel(R.month);
  const wb = new ExcelJS.Workbook(); wb.creator = 'NRCC Energy'; wb.created = new Date();
  const GREEN = 'FF0F5132', LIGHT = 'FFEEF4F0', GREY = 'FFF2F4F7';
  const sheet = (name, widths) => { const ws = wb.addWorksheet(name, { pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: { left: .5, right: .5, top: .6, bottom: .6, header: .3, footer: .3 } }, views: [{ showGridLines: false }] });
    ws.columns = widths.map(w => ({ width: w })); ws.headerFooter.oddFooter = `&L NRCC Monthly Energy Report — ${ml}&R Page &P of &N`; return ws; };
  const title = (ws, t, sub) => { ws.addRow([t]).font = { bold: true, size: 15, color: { argb: GREEN } }; ws.addRow([sub]).font = { italic: true, size: 10, color: { argb: 'FF667085' } }; ws.addRow([]); };
  const head = (ws, cells) => { const r = ws.addRow(cells); r.eachCell(c => { c.font = { bold: true, color: { argb: 'FFFFFFFF' } }; c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: GREEN } }; c.alignment = { vertical: 'middle', wrapText: true }; }); r.height = 20; return r; };
  const band = (ws, t, n) => { const r = ws.addRow([t]); ws.mergeCells(r.number, 1, r.number, n); r.getCell(1).font = { bold: true, color: { argb: GREEN } }; r.getCell(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: LIGHT } }; };
  const line = (ws, cells, fmts = [], bold) => { const r = ws.addRow(cells.map(v => v == null || (typeof v === 'number' && isNaN(v)) ? null : v)); fmts.forEach((f, i) => { if (f) r.getCell(i + 1).numFmt = f; }); r.eachCell({ includeEmpty: true }, c => { c.border = { bottom: { style: 'hair', color: { argb: 'FFD0D5DD' } } }; if (bold) { c.font = { bold: true }; c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: GREY } }; } }); return r; };
  const K = '#,##0', K2 = '#,##0.00', P0 = '0%', P1 = '0.0%';
  const status = s => ({ ok: 'OK', flagged: 'Flagged', not_in_operation: 'Not in operation', low_utilisation: 'Low utilisation', estimated: 'Estimated' })[s] || s || '';
  // Summary
  let ws = sheet('Summary', [52, 18, 16, 30]);
  title(ws, `Monthly Energy Report — ${ml}`, `Northern Region Cement Company, Turaif · Electrical Department · status: ${R.status}`);
  head(ws, ['Headline', 'kWh/t', '', 'Status']);
  line(ws, ['Gray cement', g('Summary!C38'), null, R.status_notes.gray ? 'Estimated — kiln stopped' : (g('Summary!C38') == null ? 'Not in operation' : 'OK')], [null, K2], true);
  line(ws, ['White cement', g('Summary!J37'), null, R.status_notes.white ? 'Estimated — kiln stopped' : (g('Summary!J37') == null ? 'Not in operation' : 'OK')], [null, K2], true);
  if (R.is_history) { line(ws, ['Old workbook reported — gray', R.legacy['Summary!C38']], [null, K2]); line(ws, ['Old workbook reported — white', R.legacy['Summary!J37']], [null, K2]); }
  ws.addRow([]); head(ws, ['Energy balance', 'kWh', '% of generation', '']);
  const gen = g('PP!C15') || 0;
  [['Total generation (DG1–DG9)', gen, true], ['Sent out on power plant feeders', X.outgoing], ['Power plant internal difference', X.ppdiff], ['Plant process & utilities (metered)', X.plant, true],
   ['Power plant auxiliaries', X.ppAux], ['Housing colony', X.housing], ['Water treatment station (non-plant)', X.wts], ['Metering mismatch Line I + II (out of KPIs)', X.mm1 + X.mm2]]
    .forEach(([a, b, bo]) => line(ws, [a, b, gen ? b / gen : null], [null, K, P1], bo));
  ws.addRow([]); head(ws, ['Checks', 'Count', '', '']);
  line(ws, ['STOP (must be fixed before final)', R.checks.filter(c => c.sev === 'STOP').length]); line(ws, ['Warnings', R.checks.filter(c => c.sev === 'WARNING').length]);
  // Line I / II
  const procSheet = (name, rows) => { const w = sheet(name, [46, 16, 14, 12, 16, 14, 18]); title(w, `${name} — ${ml}`, 'kWh, tonnes and kWh per tonne; expected energy from the fixed yardstick (decision 29)');
    head(w, ['Process', 'kWh', 'Tonnes', 'kWh/t', 'Expected kWh', 'Energy vs expected', 'Status']);
    rows.forEach(r => r.band ? band(w, r.band, 7) : line(w, [r[0], r[1], r[2], r[3], r[4], r[5] == null ? null : 1 / r[5], status(r[6])], [null, K, K, K2, K, P0], r[7])); return w; };
  const R1 = (c, label) => { const x = R.r1[c] || {}; return [label, x.kwh, x.tonnes, x.kwh_t, x.good_fit ? x.expected : null, x.good_fit ? x.perf : null, x.status]; };
  const plain = (label, c, t, k, bold) => [label, g(c), t == null ? null : g(t), g(k), null, null, g(k) == null ? 'not_in_operation' : 'ok', bold];
  ws = procSheet('Line I', [{ band: 'Clinker line' }, R1('LS1', 'Limestone crusher 1'), plain('Corrective crusher', 'Summary!C7', 'Summary!D7', 'Summary!E7'), R1('RM1', 'Raw mill 1'), R1('K1', 'Kiln 1'),
    plain('Clinker line I', 'Summary!C10', 'Summary!D9', 'Summary!E10', true), plain('Utilities — clinker share', 'Summary!C11', null, 'Summary!E11'), plain('Clinker incl. utilities', 'Summary!C12', 'Summary!D9', 'Summary!E12', true),
    { band: 'Cement' }, plain('Additive crusher', 'Summary!C14', 'Summary!D14', 'Summary!E14'), R1('CM1', 'Cement mill 1 (all products)'), R1('CM2', 'Cement mill 2 (all products)'),
    plain('White cement — mills + roller press', 'Summary!C17', 'Summary!D15', 'Summary!E17'), plain('Gray cement — mills + roller press', 'Summary!C20', 'Summary!D18', 'Summary!E20'),
    plain('Utilities — gray cement share', 'Summary!C23', 'Summary!D18', 'Summary!E23'), plain('Packing plant', 'Summary!C26', 'Summary!D21', 'Summary!E26')]);
  ws.addRow([]); head(ws, ['Gray cement headline', 'Value', '', '', '', '', '']);
  [['Clinker per t gray cement (t/t)', g('Summary!C30'), '0.000'], ['Clinker part (kWh/t)', g('Summary!C33'), K2], ['Grinding incl. utilities (kWh/t)', g('Summary!C35'), K2], ['Packing (kWh/t)', g('Summary!C36'), K2], ['Gray cement (kWh/t)', g('Summary!C38'), K2]]
    .forEach(([a, b, f], i) => line(ws, [a, b], [null, f], i === 4));
  ws = procSheet('Line II', [R1('LS2', 'Limestone crusher 2'), R1('RM2', 'Raw mill 2 (incl. substation remainder)'), R1('K2', 'Kiln 2'),
    plain('Clinker line II', 'Summary!K10', 'Summary!L9', 'Summary!M10', true), plain('Utilities Line II', 'Summary!K11', 'Summary!L9', 'Summary!M11'), plain('Clinker II incl. utilities', 'Summary!K12', 'Summary!L9', 'Summary!M12', true)]);
  ws.addRow([]); head(ws, ['White cement headline', 'Value', '', '', '', '', '']);
  [['Clinker per t white cement (t/t)', g('Summary!J29'), '0.000'], ['Clinker part (kWh/t)', g('Summary!J32'), K2], ['Grinding incl. utilities (kWh/t)', g('Summary!J34'), K2], ['Packing (kWh/t)', g('Summary!J35'), K2], ['White cement (kWh/t)', g('Summary!J37'), K2]]
    .forEach(([a, b, f], i) => line(ws, [a, b], [null, f], i === 4));
  // Power plant
  ws = sheet('Power plant', [12, 34, 16, 14, 16, 12]); title(ws, `Power plant & energy balance — ${ml}`, 'PIC Power Generation & Consumption; plant incomers for the feeder check');
  head(ws, ['Unit', 'Meter', 'kWh', 'Share', '', '']); R.dg.forEach(d => line(ws, [d.code, d.name, d.kwh, gen ? (d.kwh || 0) / gen : null], [null, null, K, P1]));
  line(ws, ['Total', 'Generation', gen, 1], [null, null, K, P0], true); ws.addRow([]);
  head(ws, ['Feeder', 'Supplies', 'PP side kWh', 'Plant incomer', 'Plant side kWh', 'Difference']);
  R.feeders.forEach(f => line(ws, [f.code, f.name, f.kwh, f.plant || '', f.plant_kwh, f.plant_kwh != null && f.kwh ? (f.plant_kwh - f.kwh) / f.kwh : null], [null, null, K, null, K, P1]));
  ws.addRow([]); head(ws, ['Balance item', '', 'kWh', '', '', '']);
  [['Power plant internal difference', X.ppdiff], ['Raw mill 2 substation remainder (E1A)', g('E1A_substation_remainder')], ['Cement mill substation remainder (E14)', g('E14_substation_remainder')],
   ['Metering mismatch Line I', X.mm1], ['Metering mismatch Line II', X.mm2], [`Running total ${R.run12.months} months — Line I`, R.run12.l1], [`Running total ${R.run12.months} months — Line II`, R.run12.l2]]
    .forEach(([a, b]) => { const r = line(ws, [a, '', b], [null, null, K]); ws.mergeCells(r.number, 1, r.number, 2); });
  // Checks
  ws = sheet('Checks', [12, 10, 110]); title(ws, `Checks — ${ml}`, 'STOP = fix before final · Warning = published flagged · Note = information');
  head(ws, ['Severity', 'Check', 'Finding']); R.checks.forEach(c => { const r = line(ws, [c.sev, c.id, c.msg], []); r.getCell(3).alignment = { wrapText: true };
    r.getCell(1).font = { bold: true, color: { argb: c.sev === 'STOP' ? 'FFB42318' : c.sev === 'WARNING' ? 'FFB54708' : 'FF175CD3' } }; });
  // Trend
  ws = sheet('Trend 12 months', [14, 14, 14, 18, 18]); title(ws, 'Headline trend', '* estimated — kiln stopped');
  head(ws, ['Month', 'Gray kWh/t', 'White kWh/t', 'Mismatch L1 kWh', 'Mismatch L2 kWh']);
  R.trend.forEach(t => line(ws, [monthLabel(t.m) + (t.gray_est ? ' *' : ''), t.gray, t.white, t.l1mm, t.l2mm], [null, K2, K2, K, K]));
  // Rules
  ws = sheet('Rules in force', [12, 52, 18, 18, 10, 70]); title(ws, `Rules in force for ${ml}`, 'Every split, fixed value, threshold and yardstick (Rules table)');
  head(ws, ['Rule', 'Name', 'Setting', 'Value', 'From', 'Reason']); R.rules_in_force.forEach(x => { const r = line(ws, [x.rule, x.name, x.setting, x.value, x.valid_from, x.reason], []); r.getCell(6).alignment = { wrapText: true }; });
  wb.eachSheet(w => { w.views = [{ state: 'frozen', ySplit: 3, showGridLines: false }]; });
  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  a.download = `NRCC Energy Report ${R.month}.xlsx`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Excel report downloaded');
}

    const k = b.dataset.add, [rid, set] = k.split('|');
    const v = app.querySelector(`[data-nv="${k}"]`).value.trim(), f = app.querySelector(`[data-nf="${k}"]`).value, r = app.querySelector(`[data-nr="${k}"]`).value.trim();
    if (!v || !r) return toast('Give the new value and a reason');
    if (!confirm(`Change ${rid}.${set} to "${v}" from ${monthLabel(f)} on?`)) return;
    await q(sb.schema('energy').rpc('add_rule_value', { p_rule: rid, p_setting: set, p_value: v, p_valid_from: f, p_reason: r }));
    toast('Rule changed — recalculate the open month (Run checks) to apply it'); rulesView();
  });
}

// ================= HISTORY =================
async function historyView() {
  $('#title').textContent = 'History';
  app.innerHTML = topNav('history') + '<div class="card">Loading…</div>';
  const [months, log, corr, rules, users] = await Promise.all([
    q(sb.from('month').select('*').order('month_key', { ascending: false })),
    q(sb.from('change_log').select('*').order('at', { ascending: false }).limit(300)),
    q(sb.from('correction').select('*').order('month_key')),
    q(sb.from('rule').select('*').neq('profile', 'legacy').order('created_at', { ascending: false })),
    q(sb.from('app_user').select('user_id,full_name'))]);
  const who = id => users.find(u => u.user_id === id)?.full_name || (id ? 'user' : '—');
  const firstLoad = rules.length ? rules[rules.length - 1].created_at.slice(0, 10) : '';
  const changedRules = rules.filter(r => r.valid_from > '2025-07');
  app.innerHTML = topNav('history') + `
  <div class="card"><h2>Month status</h2><table class="t"><thead><tr><th>Month</th><th>Status</th><th>Final on</th><th>By</th><th>Note</th></tr></thead><tbody>
    ${months.map(m => `<tr><td>${monthLabel(m.month_key)}</td><td><span class="pill p-${m.status}">${m.status}</span></td><td>${m.finalised_at ? new Date(m.finalised_at).toLocaleString('en-GB') : ''}</td><td>${who(m.finalised_by)}</td><td class="muted">${esc(m.note || '')}</td></tr>`).join('')}</tbody></table></div>
  <div class="card"><h2>Changes to final months</h2>${log.length ? `<table class="t"><thead><tr><th>When</th><th>Who</th><th>Month</th><th>What</th><th>Old → new</th><th>Reason</th></tr></thead><tbody>
    ${log.map(l => `<tr><td>${new Date(l.at).toLocaleString('en-GB')}</td><td>${who(l.user_id)}</td><td>${l.month_key || ''}</td><td>${esc(l.tbl)}</td>
      <td class="muted" style="font-size:11px">${esc(JSON.stringify(l.old_value?.closing ?? l.old_value?.value ?? l.old_value ?? ''))} → ${esc(JSON.stringify(l.new_value?.closing ?? l.new_value?.value ?? l.new_value ?? ''))}</td><td>${esc(l.reason || '')}</td></tr>`).join('')}</tbody></table>`
    : '<p class="muted">No change has been made to a final month.</p>'}</div>
  <div class="card"><h2>Rule changes</h2>${changedRules.length ? `<table class="t"><thead><tr><th>From</th><th>Rule</th><th>New value</th><th>Reason</th><th>Added</th></tr></thead><tbody>
    ${changedRules.map(r => `<tr><td>${r.valid_from}</td><td>${esc(r.name)} <span class="muted">${r.rule_id}.${r.setting}</span></td><td><b>${esc(r.value)}</b></td><td>${esc(r.reason || '')}</td><td class="muted">${new Date(r.created_at).toLocaleDateString('en-GB')}</td></tr>`).join('')}</tbody></table>`
    : `<p class="muted">No rule changed since the system was set up${firstLoad ? ' on ' + new Date(firstLoad).toLocaleDateString('en-GB') : ''}.</p>`}</div>
  <div class="card"><h2>Recorded input corrections</h2><table class="t"><thead><tr><th>Month</th><th>Meter / item</th><th>Field</th><th class="n">Value</th><th>Reason</th></tr></thead><tbody>
    ${corr.map(c => `<tr><td>${monthLabel(c.month_key)}</td><td>${c.target}</td><td>${c.field}</td><td class="n">${fmt(c.value)}</td><td>${esc(c.reason)}</td></tr>`).join('')}</tbody></table></div>`;
}

boot();
</script>
</body>
